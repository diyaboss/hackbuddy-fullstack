services:
  - type: web
    name: hackbuddy-backend
    env: node
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: FRONTEND_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: hackbuddy-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
